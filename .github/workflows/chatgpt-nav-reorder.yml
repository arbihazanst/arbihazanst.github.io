name: One-time navigation reorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-nav-reorder.yml'

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder navigation only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<header><nav><a href="#profile">Profile</a><a href="#research">Research</a><a href="#publications">Publications</a><a href="#teaching">Teaching</a><a href="#service">Service</a></nav></header>'
          new = '<header><nav><a href="#profile">Profile</a><a href="#teaching">Teaching</a><a href="#research">Research</a><a href="#publications">Publications</a><a href="#service">Service</a></nav></header>'
          if old not in s:
              raise SystemExit('Navigation pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/chatgpt-nav-reorder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/chatgpt-nav-reorder.yml
          git commit -m "Reorder navigation to match page sections"
          git push
