name: One-time Ilmu Data link update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-ilmu-data-update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add View link and remove one-time workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<li>Nasution, A. H., &amp; Monika, W. (2025). <em>Ilmu Data.</em> UIR Press.</li>'
          new = '<li>Nasution, A. H., &amp; Monika, W. (2025). <em>Ilmu Data.</em> UIR Press. <a href="https://drive.google.com/file/d/1Va5X0QQEdl2r407bhvilcG8C3eUD1jnj/view?usp=sharing">View</a></li>'
          if old not in s:
              raise SystemExit('Target Ilmu Data entry not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/chatgpt-ilmu-data-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/chatgpt-ilmu-data-update.yml
          git commit -m "Add View link to Ilmu Data book"
          git push
